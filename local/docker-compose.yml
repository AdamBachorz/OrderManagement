services:
  postgres:
    image: postgres:16-alpine
    container_name: ordermanagement-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ordermanagement-api:
    build:
      context: ../backend
      dockerfile: OrderManagement.Api/Dockerfile
    container_name: ordermanagement-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSQL: ${ConnectionStrings__PostgreSQL}
    ports:
      - "${APP_API_PORT:-8080}:8080"
    restart: unless-stopped

  ordermanagement-apphost:
    build:
      context: ../backend
      dockerfile: OrderManagement.AppHost/Dockerfile
    container_name: ordermanagement-apphost
    depends_on:
      postgres:
        condition: service_healthy
      ordermanagement-api:
        condition: service_started
    env_file:
      - ./.env
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:18888
    ports:
      - "${APP_APPHOST_PORT:-18888}:18888"
    restart: unless-stopped

volumes:
  postgres_data:
